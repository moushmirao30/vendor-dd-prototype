# ---------------------------------------------------------------------------
# settings.yaml — every tunable number in the prototype lives here.
#
# WHY THIS FILE EXISTS: a reviewer should be able to see and change how the
# prototype behaves (how politely it fetches, how it scores confidence)
# without opening a single .py file. Behaviour lives in code; POLICY lives here.
# ---------------------------------------------------------------------------

fetch:
  # Identifies us honestly to every server we contact. Never impersonate a browser.
  user_agent: "FQL-VendorDD-Prototype/0.1 (First Quadrant Labs internship research prototype)"
  delay_seconds_per_domain: 2.0   # wait 2s between requests to the SAME domain
  timeout_seconds: 20             # give up on a slow page rather than hanging
  max_pages_per_vendor: 10        # how many pages we KEEP per vendor
  max_requests_per_vendor: 20     # how many requests we MAKE per vendor (stricter cap)
  respect_robots_txt: true        # checked with urllib.robotparser before every fetch
  follow_redirects: true
  max_redirects: 5
  # Below this many characters of visible text, or with no heading blocks at
  # all, a page is recorded as collected but NOT USABLE AS EVIDENCE. Set from
  # measured pages on 2026-08-12: Atlassian's Jira product page produced 52
  # characters and 0 blocks from 898 KB of HTML (JavaScript-rendered), its
  # pricing page 138 characters from 1.2 MB. The thinnest page that still
  # carried real evidence was Atlassian's support page at ~1,000 characters.
  # Re-derived 12 Aug 2026 from all 48 collected pages across 7 vendors, after
  # JetBrains' status page (307 chars from 225 KB of HTML) passed at 300.
  # Measured character counts: unreadable shells cluster at 8-307; the thinnest
  # page carrying real evidence was Atlassian's support page at 1,065.
  min_usable_text_chars: 600
  # Second, independent signal: readable characters per KB of HTML. A page that
  # ships a megabyte to say 1,500 words is mostly JavaScript we never ran.
  # Measured: unreadable pages 0.1-1.4 ch/KB; the lowest genuine pages were
  # Sentry's and Linear's pricing at 2.6. Set at 2.0 with that margin.
  #
  # BOTH CHECKS ARE NEEDED AND NEITHER IS SUFFICIENT. The worked examples below
  # were re-derived from the corpus on 13 Aug 2026 (defect 33). The previous
  # pair — "Postman's privacy shell has high density (27 ch/KB)" and "JetBrains'
  # status page clears any sane floor" — were FALSE against the current data:
  # Postman's privacy page is 0 chars at 0.0 ch/KB and JetBrains' status page is
  # 333 chars at 1.5 ch/KB, so both are caught by both tests and neither
  # demonstrates anything. A worked example decays the moment the data moves;
  # check the documentation against the corpus, not only the code.
  #
  #   CAUGHT ONLY BY THE FLOOR   JetBrains docs: 45 readable chars from 4,434
  #                              bytes = 10.4 ch/KB. Density is HIGH — a density
  #                              test alone passes this empty page.
  #   CAUGHT ONLY BY THE DENSITY Postman docs: 2,370 readable chars from
  #                              1,234,954 chars = 1.97 ch/KB. Clears the 600
  #                              floor by 4x. Linear docs is the same shape:
  #                              1,034 chars from 540,090 chars = 1.96 ch/KB.
  # NOTE: Agent 1 counts CHARACTERS of decoded HTML and calls them "bytes" in
  # its audit trail. The difference is under 0.01% on ASCII-dominant pages, but
  # the label is wrong; correct it the next time agent1_collect.py is touched.
  #
  # Two cheap orthogonal tests beat one clever one.
  min_readable_chars_per_kb: 2.0

cache:
  # Every page is saved to disk the first time it is fetched. Later runs read
  # from disk. Consequence: after one collection run the ENTIRE demo replays
  # offline, and a vendor changing their site cannot break your demo.
  enabled: true
  dir: "data/cache/html"
  reuse_existing: true

extraction:
  # NO `backend` KEY. Removed 19 Aug 2026 after an audit found it.
  #
  # This line used to read `backend: "rules"  # "rules" (default, free) | "llm"
  # (optional, off)`. Nothing in src/, tools/ or app.py ever read it. It advertised
  # a switchable language-model path that does not exist, in the one file a
  # reviewer opens to find out what the system does.
  #
  # A dead config key is the same defect as a dead UI control: it describes a
  # capability the code does not have, and it is read as a promise. Extraction is
  # rule-based, full stop; if an LLM path is ever added, the key comes back at the
  # same moment the code that reads it does.
  snippet_max_chars: 600          # how much of a matched block to keep as evidence
  min_body_chars_for_high: 40     # a claim must be a sentence at least this long
  max_evidence_per_field: 3       # keep briefs readable; don't dump every match
  # INTERFACE FURNITURE, CUT OUT OF QUOTES BUT NOT USED TO SUPPRESS BLOCKS.
  # Added with defect 29 (13 Aug 2026): GitHub's pricing page renders a
  # placeholder where a panel fails to load, and four of GitHub's evidence cards
  # quoted it back as vendor evidence. These are NOT negative_terms — a negative
  # term drops the whole block, and that block also contained GitHub's SOC 2
  # statement. Cut the furniture, keep the claim.
  # It also matters for scoring: "There was an error while loading." is a
  # 41-character sentence, and 40 characters is the threshold for High.
  noise_phrases:
    - "Uh oh! There was an error while loading."
    - "There was an error while loading."
    - "Please reload this page ."
    - "Please reload this page."

confidence:
  # See docs/confidence_rules.md for the plain-English version of this.
  # `trust` added 13 Aug 2026 with defect 27. The project brief names the source
  # category as "security or trust center pages" — one category, two URLs — so a
  # vendor's trust centre is exactly as authoritative as its security page.
  # GitHub is the only vendor in this corpus that publishes both.
  authoritative_source_types: ["security", "trust", "privacy", "pricing", "status", "terms"]
  secondary_source_types:     ["product", "docs", "integrations", "blog"]
  field_score:  { High: 2, Medium: 1, Low: 0, NOT_FOUND: 0 }
  core_fields:  ["security_trust", "privacy_data_handling", "support_documentation",
                 "integrations_api", "pricing_availability"]
  vendor_thresholds: { High: 8, Medium: 4 }   # out of a maximum of 10

output:
  briefs_dir: "data/briefs"
  corpus_dir: "data/corpus"
  export_formats: ["json", "csv", "markdown"]
